[project]
name = "europagrad-agent"
version = "0.1.0"
description = "EuropaGrad research pipeline: evidence-cited discovery of European Master's programs"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.12",
    "httpx>=0.27",
    "lxml>=5.3",
    "selectolax>=0.3.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "supabase>=2.9",
    "tavily-python>=0.5.0",
    "openai>=1.55",
    "tenacity>=9.0",
    "rich>=13.9",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]
crawl4ai = ["crawl4ai>=0.4"]

[project.scripts]
agent = "europagrad_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/europagrad_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
